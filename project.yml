name: mvim

options:
  bundleIdPrefix: io.github.celve
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  # Exact: the resolved-versions file lives in the generated, git-ignored .xcodeproj.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    # `make publish` tags a release v<MARKETING_VERSION>, so bump it before publishing.
    MARKETING_VERSION: "1.0.0"
    # `make release` passes the commit count instead: Sparkle orders updates by CFBundleVersion.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Stable Apple Development signature so Accessibility / Input Monitoring
    # grants persist across rebuilds. Ad-hoc ("-") changes the signature every
    # build, which makes macOS revoke the grants each time.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "8TDYAWS6VC"

targets:
  # Input tap, key model, text I/O (AX/Synth), capability config and Prefs; deliberately no Keychain.
  Core:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.celve.mvim.Core
        GENERATE_INFOPLIST_FILE: YES

  # Modal editing engine + runtime. Depends on Core for the key model + text I/O.
  Vim:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Vim
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.celve.mvim.Vim
        GENERATE_INFOPLIST_FILE: YES

  # The menu-bar app: composition root + the menu, its whole UI. Embeds the two frameworks and Sparkle.
  mvim:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/App
      - path: Resources
    dependencies:
      - target: Core
      - target: Vim
      - package: Sparkle
    postBuildScripts:
      # Code Sign On Copy re-signs Sparkle.framework but not the helpers inside it, which would
      # otherwise ship ad-hoc — and macOS lets only the app's own developer modify its bundle.
      - name: Sign Sparkle's helpers
        basedOnDependencyAnalysis: false
        script: |
          [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] || exit 0
          framework="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          helpers="$framework/Versions/B"
          sign() { codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" -o runtime "$@"; }
          sign "$helpers/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$helpers/XPCServices/Downloader.xpc"
          sign "$helpers/Autoupdate"
          sign "$helpers/Updater.app"
          sign "$framework"
    settings:
      base:
        PRODUCT_NAME: mvim
        # The identifier keys the defaults domain, the TCC grants and the login item: changing
        # it strands all three, and nothing migrates them.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.celve.mvim
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated plist: Sparkle's feed and key, from the settings below.
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: mvim.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Run as a menu bar agent: no Dock icon, no main window.
        INFOPLIST_KEY_LSUIElement: YES
        # No NSMicrophoneUsageDescription — deliberate. mvim contains no microphone or
        # keychain code, and its only network traffic is Sparkle's; keep the Info.plist honest.
        INFOPLIST_KEY_CFBundleDisplayName: mvim
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Linyu Wu. Licensed under GPL-3.0-or-later."
      configs:
        # Release only: an updater in a Debug build would offer to replace it with the release.
        Release:
          SPARKLE_FEED_URL: https://github.com/celve/mvim/releases/latest/download/appcast.xml
          # The public half of `generate_keys` (README, Publishing an update); until it is set,
          # Release builds have no updater either.
          SPARKLE_PUBLIC_KEY: ""

schemes:
  mvim:
    build:
      targets:
        mvim: all
    run:
      config: Debug
    archive:
      config: Release
